name: build
# Beat It: builds the firmware on GitHub's Linux machines, following the FM-1 Firmware Hub's shared workflow
# (zvenson/fm1-build v1: JieLi's toolchain and the AC79 SDK, then this repository's own build command and tests).
# It is a copy rather than a call because the shared workflow signs a build attestation, which GitHub only offers to
# private repositories on its Enterprise plan; everything else is the same steps with the same pinned actions.
#
# Every push and the "Run workflow" button leave a "packages" download on the run's page (Artifacts) with:
#   Beat-It-X.Y-installer.html  (install from Windows in Chrome or Edge)
#   Beat-It-X.Y.fwsc            (the firmware on its own)
#   SHA256SUMS
# A tag such as v1.1 also publishes those files as a release.
# The tests run on every build but do not block it: the known failures are the SLOOP tests for sounds Beat It removed
# (sample chop, the SAMPLE engine, removed presets' reference renders). Read the Tests step's log for anything new.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # the release on a tag
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install Pillow 'bleak>=0.22,<4'

      - name: JieLi Linux toolchain (pkgman.jieliapp.com)
        run: |
          mkdir -p ~/.jieli
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "toolchain: $(basename "$TC")"

      - name: JieLi AC79 SDK (gitee.com, a fixed tag)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build (firmware + Windows installer page)
        run: sh tools/ci_build_beatit.sh

      - name: Bluetooth tests (simulator and host; must pass)
        run: sh tools/ci_bt_tests.sh

      - name: Tests (known failures for removed sounds; not blocking)
        continue-on-error: true
        run: sh tests/run_tests.sh

      - name: The packages and their SHA-256
        run: sha256sum build/Beat-It-* | sed 's#build/##' | tee SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: packages
          path: |
            build/Beat-It-*
            SHA256SUMS
          if-no-files-found: error

      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8   # v2.3.2
        with:
          files: |
            build/Beat-It-*
            SHA256SUMS
          generate_release_notes: true
